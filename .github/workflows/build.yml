name: Build curl_cffi for FunctionGraph

on:
  # 允许手动触发
  workflow_dispatch:

jobs:
  build:
    # 使用 ubuntu-20.04，glibc 版本较旧，兼容性更好
    # 如果后续 GitHub 弃用，可改为 ubuntu-22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Show environment
        run: |
          echo "===== OS 信息 ====="
          cat /etc/os-release
          echo "===== Python 版本 ====="
          python --version
          echo "===== 架构 ====="
          uname -m
          echo "===== glibc 版本 ====="
          ldd --version | head -n 1

      - name: Install curl_cffi
        run: |
          mkdir -p deps
          pip install curl_cffi==0.14.0 -t ./deps

      - name: Verify .so files
        run: |
          echo "===== 搜索所有 .so 文件 ====="
          find deps -name "*.so" -exec file {} \;
          echo ""
          echo "===== 确认关键文件 ====="
          ls -la deps/_cffi_backend*.so || echo "未找到 _cffi_backend.so"
          ls -la deps/curl_cffi/ | head -n 20

      - name: Package deps
        run: |
          cd deps
          zip -rq ../curl_cffi_deps.zip .
          cd ..
          echo "===== 打包完成 ====="
          ls -lh curl_cffi_deps.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl_cffi_deps
          path: curl_cffi_deps.zip
          retention-days: 7
